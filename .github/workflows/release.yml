name: Release

# ONE dispatch releases BOTH packages at the same version.
# Actions tab → "Run workflow" → enter a version (e.g. 0.2.0, leading "v" is
# optional) and optionally check "beta" for a pre-release.
#
# The run: gate on checks → bump BOTH package.json files → one release
# commit → two tags (v<semver> for the extension, cli-v<semver> for the npm
# CLI) → push → package the .vsix → GitHub Release (vsix + CLI tarball) →
# publish to the Visual Studio Marketplace, OpenVSX, and npm.
#
# Required secrets (repo → Settings → Secrets and variables → Actions):
#   VSCE_PAT — Marketplace personal access token with the "Manage" scope
#              (https://code.visualstudio.com/api/working-with-extensions/publishing)
#   OVSX_PAT — OpenVSX access token (https://open-vsx.org → create token)
#
# npm auth is OIDC trusted publishing — NO token secret. NOTE: the npm package
# `git-colabor`'s trusted publisher must point at THIS repository
# (hnrobert/vscode-git-colabor, workflow release.yml, environment release).
# It was originally bound to the standalone hnrobert/git-colabor repo — if
# publishing fails with an OIDC/origin error, rebind it at
# https://www.npmjs.com/package/git-colabor/access.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.0) — applied to BOTH packages"
        required: true
        type: string
      beta:
        description: "pre-release (beta)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write # release commit + tags + GitHub Release
  id-token: write # npm OIDC trusted publishing

concurrency:
  group: release
  cancel-in-progress: false # never interrupt a publish mid-flight

jobs:
  release:
    name: Build and publish both packages
    runs-on: ubuntu-latest
    environment: release # npm OIDC trusted-publishing environment
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the release tags

      # pnpm version comes from package.json `packageManager` — don't pass a
      # `version` input, it conflicts and throws ERR_PNPM_BAD_PM_VERSION.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          registry-url: https://registry.npmjs.org # npm OIDC audience

      # One workspace install covers the root and packages/* (single lockfile).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: |
          pnpm typecheck
          pnpm -C packages/git-colabor typecheck

      - name: Lint
        run: |
          pnpm lint
          pnpm -C packages/git-colabor lint

      - name: Test
        run: |
          pnpm test
          pnpm -C packages/git-colabor test
          pnpm -C packages/git-colabor test:e2e

      - name: Build
        run: pnpm build # build:cli → tsup → copy bundled CLI into resources/

      # Invalid semver fails the bump step below (pnpm version validates).
      - name: Resolve version inputs
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BETA: ${{ inputs.beta }}
        run: |
          SEMVER="${INPUT_VERSION#v}" # tolerate "v0.2.0"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "ext_tag=v$SEMVER" >> "$GITHUB_OUTPUT"
          echo "cli_tag=cli-v$SEMVER" >> "$GITHUB_OUTPUT"
          if [ "$INPUT_BETA" = "true" ] || [[ "$SEMVER" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # One commit carries both bumps; two tags so extension and CLI releases
      # stay independently addressable (v0.2.0 / cli-v0.2.0).
      - name: Bump both packages, commit, tag, push
        env:
          SEMVER: ${{ steps.version.outputs.semver }}
          EXT_TAG: ${{ steps.version.outputs.ext_tag }}
          CLI_TAG: ${{ steps.version.outputs.cli_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for T in "$EXT_TAG" "$CLI_TAG"; do
            if git rev-parse "$T" >/dev/null 2>&1; then
              echo "::error::tag $T already exists — pick a new version"
              exit 1
            fi
          done
          pnpm version "$SEMVER" --no-git-tag-version
          pnpm -C packages/git-colabor version "$SEMVER" --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_REF#refs/heads/}"
          git add package.json packages/git-colabor/package.json pnpm-lock.yaml
          git commit -m "chore(release): $EXT_TAG (extension) + $CLI_TAG (CLI)"
          git tag "$EXT_TAG"
          git tag "$CLI_TAG"
          git push origin "HEAD:$BRANCH" "$EXT_TAG" "$CLI_TAG"

      - name: Package the extension
        env:
          EXT_TAG: ${{ steps.version.outputs.ext_tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            pnpm exec vsce package --no-dependencies --pre-release -o "git-colabor-${EXT_TAG}.vsix"
          else
            pnpm exec vsce package --no-dependencies -o "git-colabor-${EXT_TAG}.vsix"
          fi

      # npm pack of the CLI package: the tarball rides the GitHub Release so
      # the exact published bits are downloadable without npm.
      - name: Pack the CLI
        env:
          CLI_TAG: ${{ steps.version.outputs.cli_tag }}
        run: |
          pnpm -C packages/git-colabor build
          pnpm -C packages/git-colabor pack --pack-destination ../../

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.ext_tag }}
          name: ${{ steps.version.outputs.ext_tag }}
          files: |
            git-colabor-${{ steps.version.outputs.ext_tag }}.vsix
            git-colabor-${{ steps.version.outputs.cli_tag }}.tgz
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Visual Studio Marketplace
        env:
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            pnpm exec vsce publish --no-dependencies --pre-release -p "$VSCE_PAT"
          else
            pnpm exec vsce publish --no-dependencies -p "$VSCE_PAT"
          fi

      # No --pre-release here: the flag is ignored for a prepackaged .vsix
      # (pre-release-ness is baked in by `vsce package --pre-release`).
      - name: Publish to OpenVSX
        env:
          EXT_TAG: ${{ steps.version.outputs.ext_tag }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: pnpm dlx ovsx publish "git-colabor-${EXT_TAG}.vsix" -p "$OVSX_PAT"

      # npm OIDC trusted publishing — id-token: write + registry-url above;
      # NO_NODE_FLUSH etc. not needed. Beta runs publish under the `beta` dist-tag.
      - name: Publish CLI to npm
        env:
          NODE_AUTH_TOKEN: "" # explicit: auth comes from OIDC, not a token
          NPM_TAG: ${{ steps.version.outputs.npm_tag }}
        run: pnpm -C packages/git-colabor publish --access public --tag "$NPM_TAG" --no-git-checks
