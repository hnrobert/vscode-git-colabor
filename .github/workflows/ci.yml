name: CI

# Checks for BOTH packages of the monorepo — the extension (repo root) and
# the bundled CLI (packages/git-colabor) — in one run. Documentation-only
# changes never trigger a run.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "build-scripts/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - "tsup.config.ts"
      - "vitest.config.ts"
      - "eslint.config.js"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "build-scripts/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - "tsup.config.ts"
      - "vitest.config.ts"
      - "eslint.config.js"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # cancel stale PR runs, never main

jobs:
  test:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # pnpm version comes from package.json `packageManager` — don't pass a
      # `version` input, it conflicts and throws ERR_PNPM_BAD_PM_VERSION.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      # One workspace install covers the root and packages/* (single lockfile).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: |
          pnpm typecheck
          pnpm -C packages/git-colabor typecheck

      - name: Lint
        run: |
          pnpm lint
          pnpm -C packages/git-colabor lint

      - name: Test
        run: |
          pnpm test
          pnpm -C packages/git-colabor test
          pnpm -C packages/git-colabor test:e2e

      - name: Build
        run: pnpm build # build:cli → tsup → copy bundled CLI into resources/
